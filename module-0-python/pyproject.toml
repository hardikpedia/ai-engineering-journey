[project]
name = "module0"
version = "0.1.0"
description = "Module 0 - Python for JS/TS devs"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.152.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.15.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
